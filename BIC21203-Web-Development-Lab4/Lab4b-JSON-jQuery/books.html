
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle"></p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor"></p>

    <h2>Genres of Both Books</h2>
    <div id="genres"></div>

    <p id="error" role="alert"></p>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load book data.");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) ||
                    data.books.length < 2) {
                    throw new Error("Invalid book data.");
                }

                const books = data.books;

                // (a) Display title of first book
                document.getElementById("firstTitle").textContent =
                    books[0].title;

                // (b) Display author of second book
                document.getElementById("secondAuthor").textContent =
                    books[1].author;

                // (c) Display genres grouped by book title
                const genresDiv = document.getElementById("genres");

                books.forEach(book => {
                    const p = document.createElement("p");

                    p.textContent =
                        book.title + " - " + book.genres.join(", ");

                    genresDiv.appendChild(p);
                });

            } catch (error) {
                document.getElementById("error").textContent =
                    "Error: " + error.message;
            }
        }

        loadBooks();
    </script>

</body>
</html>
